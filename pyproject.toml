[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krama-core"
version = "1.0.0a4"
description = "Python-first open-source ABDM integration toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rishi Kanajam", email = "rishi@nirvyalabs.com"}
]
keywords = ["abdm", "fhir", "healthcare", "india", "ehr", "abha"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "typing-extensions>=4.14.1",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "build",
    "pip-audit",
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.16.0,<0.17.0",
    "twine",
]
ai = [
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
]
whatsapp = [
    "httpx>=0.27.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/NirvyaLabs/Krama-Core"
Repository = "https://github.com/NirvyaLabs/Krama-Core"
Issues = "https://github.com/NirvyaLabs/Krama-Core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
